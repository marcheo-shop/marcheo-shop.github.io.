<style>:root{
  --bg:#F4F5F9; --bg2:#FFFFFF; --card:#FFFFFF; --card2:#F1F3F8; --line:#E3E6EE; --line2:#D5DAE6;
  --text:#0B1840; --muted:#55607C; --dim:#8790A8; --navy:#0B1840;
  --gold:#FF6A00; --gold2:#E85A00; --goldInk:#FFFFFF;
  --ok:#14A86B; --warn:#D98200; --bad:#E5383B; --blue:#1A73E8;
  --r:16px; --display:Inter, system-ui, sans-serif; --body:Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:84px}
a{color:var(--gold);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-top:12px;padding-bottom:10px}
.row1{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:9px;color:var(--text)}
.logo .gem{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0%,#F3E7D3 18%,#9DB9F0 42%,#E2B6D6 60%,#7FE0D0 74%,#B98E45 100%);box-shadow:0 0 18px rgba(255,106,0,.35)}
.logo b{font:700 23px/1 var(--display);letter-spacing:.16em}
.ibtn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.ibtn:hover{background:var(--card)}
.dot{position:absolute;top:6px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.search{display:flex;align-items:center;gap:6px;height:46px;border-radius:999px;background:var(--card);border:1px solid var(--line2);padding:0 5px 0 15px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:14.5px}
.search input::placeholder{color:var(--dim)}
.search .go{width:36px;height:36px;border-radius:50%;border:0;background:var(--gold);color:var(--goldInk);display:flex;align-items:center;justify-content:center;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:500;color:var(--text);background:var(--card);border:1px solid var(--line);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--gold);color:var(--goldInk);border-color:var(--gold);font-weight:700}
.desk{display:none}
@media(min-width:900px){.desk{display:flex;gap:4px}.top .wrap{flex-direction:row;align-items:center;flex-wrap:wrap}.row1{flex:none}.search{flex:1;min-width:280px}.top .chips{flex-basis:100%}}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.98);border-top:1px solid var(--line);display:flex;padding:0 4px env(safe-area-inset-bottom)}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;min-height:60px;color:var(--dim);font-size:11px;font-weight:500;position:relative}
.bnav a.on{color:var(--text);font-weight:600}
.bnav a.on::before{content:"";position:absolute;top:0;width:24px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.bnav .dot{top:4px;right:calc(50% - 22px)}

/* hero */
.hero{position:relative;margin-top:16px;border-radius:26px;overflow:hidden;background:radial-gradient(120% 140% at 85% 20%,#1B2440 0%,#0D1222 55%,#080B14 100%);border:1px solid var(--line);min-height:240px;display:flex;align-items:flex-end;padding:22px}
.hero .txt{position:relative;z-index:2;max-width:66%}
.hero p{text-shadow:0 1px 8px rgba(6,8,14,.9)}
.kick{font-size:11px;letter-spacing:.2em;font-weight:600;color:var(--gold);text-transform:uppercase}
.hero h1{margin:8px 0 8px;font:600 clamp(34px,8.5vw,64px)/.98 var(--display)}
.hero p{margin:0 0 16px;color:var(--muted);font-size:13.5px}
.stage{position:absolute;right:-78px;top:42%;transform:translateY(-50%);width:min(60vw,330px);aspect-ratio:1;perspective:900px}
.opal{position:absolute;inset:8%;border-radius:50%;transform-style:preserve-3d;transition:transform .25s ease-out;box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 80px rgba(150,180,255,.18)}
.opal .l1,.opal .l2,.opal .l3,.opal .shine{position:absolute;inset:0;border-radius:50%}
.opal .l1{background:conic-gradient(from 0deg,#F6E7CF,#9FBDF5,#E6B4D8,#86E3D3,#F2D08C,#B3A2F2,#F6E7CF);filter:blur(8px) saturate(1.15);animation:spin 14s linear infinite}
.opal .l2{background:radial-gradient(circle at 70% 75%,rgba(8,11,20,.75),transparent 55%),radial-gradient(circle at 30% 30%,rgba(255,255,255,.85),transparent 26%);mix-blend-mode:normal}
.opal .l3{background:conic-gradient(from 90deg,transparent,rgba(255,255,255,.35),transparent 30%,rgba(127,224,208,.4),transparent 60%,rgba(230,180,216,.45),transparent);mix-blend-mode:overlay;animation:spin 9s linear infinite reverse}
.opal .shine{background:radial-gradient(ellipse 30% 16% at 34% 22%,rgba(255,255,255,.95),transparent 70%);transform:translateZ(30px)}
.ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,106,0,.25);animation:spin 30s linear infinite}
.ring::after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold)}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.opal .l1,.opal .l3,.ring{animation:none}}
@media(min-width:900px){.hero{min-height:360px;padding:44px}.hero .txt{max-width:50%}.stage{right:6%;top:50%}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--gold2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--goldInk)}
.btn.gold:hover{background:#FF8A33}
.btn.ghost{background:transparent}
.btn.bad{background:transparent;border-color:rgba(255,107,107,.5);color:var(--bad)}
.btn.sm{min-height:38px;padding:0 14px;font-size:13px}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:default}

/* sections */
.sec{margin-top:26px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sh h2{margin:0;font-size:18px;font-weight:700}
.sh a{font-size:13px;font-weight:600}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 6px}
@media(min-width:700px){.cats{grid-template-columns:repeat(10,1fr)}}
.cat{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--text);font-size:11.5px;font-weight:500;text-align:center}
.cat span{width:56px;height:56px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trust div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11.5px;color:var(--muted)}
.trust svg{color:var(--gold)}
.timer{display:flex;gap:3px;font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;align-items:center}
.timer b{background:var(--gold);color:var(--goldInk);padding:3px 6px;border-radius:6px}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .pc{width:152px;flex:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(5,1fr)}}

/* product card */
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:7px;display:flex;flex-direction:column;gap:7px;color:var(--text);position:relative;transition:border-color .15s,transform .15s}
.pc:hover{border-color:var(--line2);transform:translateY(-2px)}
.pimg{position:relative;aspect-ratio:1;border-radius:11px;overflow:hidden;background:linear-gradient(135deg,#171D31,#10152A)}
.pimg img{width:100%;height:100%;object-fit:cover}
.noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.tag{position:absolute;top:7px;left:7px;background:rgba(255,255,255,.92);color:var(--text);font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:6px;border:1px solid var(--line2)}
.tag.off{background:var(--bad);border-color:var(--bad);color:#fff}
.fav{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.fav.on{color:var(--bad)}
.fav.on svg{fill:currentColor}
.pc .t{font-size:13px;line-height:1.3;padding:0 3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.pc .p{padding:0 3px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price{font-weight:700;font-size:16px}
.old{color:var(--dim);text-decoration:line-through;font-size:12px}
.pc .m{padding:0 3px 3px;font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:4px}
.empty{background:var(--card);border:1px dashed var(--line2);border-radius:16px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}

/* panels & forms */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel+.panel{margin-top:12px}
.panel h2,.panel h3{margin:0 0 10px;font-size:16px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{min-height:48px;border-radius:13px;background:var(--bg2);border:1px solid var(--line2);padding:10px 14px;color:var(--text);outline:none;width:100%}
.field textarea{min-height:100px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{font-size:13px;margin-top:8px;min-height:18px}
.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.page{padding-top:16px;padding-bottom:20px}
.ph{display:flex;align-items:center;gap:8px;margin:4px 0 14px}
.ph h1{margin:0;font-size:22px;font-weight:700}
.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}

/* product page */
.pp{display:grid;gap:14px}
@media(min-width:900px){.pp{grid-template-columns:1.1fr 1fr;align-items:start}}
.gal{position:relative;border-radius:22px;overflow:hidden;background:var(--card);aspect-ratio:1}
.gal .track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal .track::-webkit-scrollbar{display:none}
.gal .track img,.gal .track .noimg{flex:none;width:100%;height:100%;object-fit:cover;scroll-snap-align:start}
.gal .cnt{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(11,24,64,.75);font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.bdg{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:7px;background:var(--card2);border:1px solid var(--line2)}
.bdg.gold{color:var(--gold);border-color:rgba(255,106,0,.4)}
.bdg.ok{color:var(--ok);border-color:rgba(67,209,158,.35)}
.bdg.warn{color:var(--warn);border-color:rgba(240,180,76,.4)}
.bdg.bad{color:var(--bad);border-color:rgba(255,107,107,.4)}
.bigprice{font-size:30px;font-weight:700;letter-spacing:-.01em}
.seller{display:flex;align-items:center;gap:12px;color:var(--text)}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#7a5a24);color:var(--goldInk);display:flex;align-items:center;justify-content:center;font:700 20px var(--display);flex:none}
.buybar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(255,255,255,.98);border-top:1px solid var(--line);padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.buybar .mini{width:54px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--text);background:none;border:0;cursor:pointer}
.buybar .btn{flex:1}
.steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted)}
.steps b{color:var(--text)}
.stars{display:inline-flex;gap:1px;color:var(--gold)}
.stars svg{width:15px;height:15px}
.stars svg.f{fill:currentColor}

/* lists */
.lrow{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 4px;border-bottom:1px solid var(--line);color:var(--text)}
.lrow:last-child{border-bottom:0}
.lrow span.g{flex:1}
.lrow .chev{color:var(--dim)}
.oc{display:flex;gap:12px;align-items:center;color:var(--text);padding:12px 0;border-bottom:1px solid var(--line)}
.oc:last-child{border-bottom:0}
.thumb{width:62px;height:62px;border-radius:12px;overflow:hidden;background:var(--card2);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.qty{display:flex;align-items:center;border:1px solid var(--line2);border-radius:999px}
.qty button{width:36px;height:36px;border:0;background:none;color:var(--text);cursor:pointer;font-size:18px}
.qty span{min-width:22px;text-align:center;font-weight:600}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.tot.big{font-size:18px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.track-steps{display:flex;justify-content:space-between;position:relative;margin:8px 0 4px}
.track-steps::before{content:"";position:absolute;left:8%;right:8%;top:14px;height:2px;background:var(--line2)}
.track-steps div{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--dim);width:20%;text-align:center}
.track-steps i{width:30px;height:30px;border-radius:50%;background:var(--card2);border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:700}
.track-steps .on{color:var(--text)}
.track-steps .on i{background:var(--gold);border-color:var(--gold);color:var(--goldInk)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding:4px 0}
.bub{max-width:80%;padding:9px 12px;border-radius:14px;background:var(--card2);font-size:14px;align-self:flex-start}
.bub.me{align-self:flex-end;background:#FFF1E6;border:1px solid rgba(255,106,0,.35)}
.bub small{display:block;color:var(--dim);font-size:10.5px;margin-top:3px}
.chatform{display:flex;gap:8px;margin-top:10px}
.chatform input{flex:1;min-height:46px;border-radius:999px;background:var(--bg2);border:1px solid var(--line2);padding:0 16px;outline:none}

/* account */
.acc-head{border-radius:24px;padding:22px 18px 60px;background:radial-gradient(120% 120% at 90% 0%,#1F2A4A 0%,#0D1222 60%);border:1px solid var(--line);position:relative;overflow:hidden}
.acc-card{margin:-44px 10px 0;position:relative}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.stat4 a{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--text);font-size:11.5px;position:relative}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpis div{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpis b{display:block;font-size:24px}
.kpis span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.tabs::-webkit-scrollbar{display:none}
.plans{display:grid;gap:10px}
@media(min-width:700px){.plans{grid-template-columns:repeat(3,1fr)}}
.plan{background:var(--card2);border:1px solid var(--line2);border-radius:18px;padding:18px;cursor:pointer;position:relative}
.plan.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.plan strong{display:block;font-size:24px;margin:4px 0}
.plan ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:13px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:linear-gradient(90deg,rgba(255,106,0,.16),rgba(127,167,255,.08));border:1px solid rgba(255,106,0,.3);font-size:13.5px;margin-bottom:12px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos div{width:76px;height:76px;border-radius:12px;overflow:hidden;position:relative;background:var(--card2)}
.photos img{width:100%;height:100%;object-fit:cover}
.photos button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer}
.zones{display:grid;gap:8px}
.zone{display:grid;grid-template-columns:auto 1fr 110px;gap:10px;align-items:center;font-size:14px}
.zone input[type=number]{min-height:40px;border-radius:10px;background:var(--bg2);border:1px solid var(--line2);padding:0 10px;width:100%}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center}
.demo{background:#FFF1E6;color:var(--gold);text-align:center;font-size:12px;padding:6px 10px;border-bottom:1px solid rgba(255,106,0,.3)}
footer.f{margin-top:40px;padding:26px 0 20px;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px}
footer.f .links{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px}
footer.f a{color:var(--muted)}
.wa{position:fixed;right:14px;bottom:92px;z-index:35;width:52px;height:52px;border-radius:50%;background:#1FAF5A;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(0,0,0,.45)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
.loader{display:flex;justify-content:center;padding:60px 0}
.loader i{width:34px;height:34px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--gold);animation:spin 1s linear infinite}

/* ===== Velzaro v2 : thème clair bleu marine & orange ===== */
body{background:var(--bg)}
.top{box-shadow:0 2px 10px rgba(11,24,64,.06)}
.logo img{height:34px;width:auto}
.callbar{background:var(--navy);color:#fff;font-size:12.5px;text-align:center;padding:6px 10px}
.callbar a{color:#FFB37A;font-weight:700}
.search{background:#fff;border:2px solid var(--gold)}
.search .go{background:var(--gold);color:#fff}
.chip{background:#fff}
.chip.on{color:#fff}
.btn.gold{color:#fff}
.bnav a.on{color:var(--gold)}
.carousel{position:relative;margin-top:14px;border-radius:18px;overflow:hidden;aspect-ratio:2.1/1;min-height:170px;box-shadow:0 6px 20px rgba(11,24,64,.12)}
.slides{display:flex;height:100%;transition:transform .6s cubic-bezier(.6,0,.2,1)}
.slide{flex:0 0 100%;height:100%;position:relative;display:flex;align-items:center;padding:18px 20px;overflow:hidden;color:#fff}
.slide h2{margin:6px 0;font:800 clamp(20px,5.6vw,40px)/1.05 var(--body);max-width:62%}
.slide p{margin:0 0 10px;font-size:13px;opacity:.92;max-width:60%}
.slide .kick{color:#FFB37A}
.slide .btn{background:#fff;color:var(--navy);border:0}
.s1{background:linear-gradient(120deg,#0B1840 0%,#16307A 60%,#FF6A00 140%)}
.s1 .big{position:absolute;right:-20px;bottom:-30px;width:46%;max-width:260px;animation:float 4s ease-in-out infinite}
.s2{background:linear-gradient(120deg,#FF6A00,#FF9A3D)}
.s2 .pays{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;gap:10px}
.s2 .pays img{height:clamp(54px,16vw,96px);width:auto;border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:float 3.6s ease-in-out infinite}
.s2 .pays img+img{animation-delay:.6s}
.s3{background:linear-gradient(120deg,#0E7C66,#14A86B)}
.s3 .ph3{position:absolute;right:0;bottom:0;height:100%;width:44%;object-fit:cover;object-position:top;mask-image:linear-gradient(90deg,transparent,#000 30%);-webkit-mask-image:linear-gradient(90deg,transparent,#000 30%)}
@keyframes float{50%{transform:translateY(-8px)}}
.s2 .pays img{transform-origin:center}
.cdots{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.cdots button{width:8px;height:8px;border-radius:5px;border:0;background:rgba(255,255,255,.5);padding:0;cursor:pointer;transition:width .3s}
.cdots button.on{width:22px;background:#fff}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--text);text-align:center;background:none!important;border:0!important;padding:0!important}
.cat .ci{width:100%;max-width:74px;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#FFF1E6;display:flex;align-items:center;justify-content:center;color:var(--gold);box-shadow:0 3px 10px rgba(11,24,64,.10);border:2px solid #fff;outline:2px solid #FFE0CC}
.cat .ci img{width:100%;height:100%;object-fit:cover}
.cat .ci svg{width:30px;height:30px}
.trust2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trust2>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;text-align:center;color:var(--text)}
.trust2 .lg{display:flex;gap:4px;height:28px}
.trust2 .lg img{height:28px;width:auto;border-radius:6px}
.vchk{display:inline-flex;width:16px;height:16px;border-radius:50%;background:var(--blue);color:#fff;align-items:center;justify-content:center;vertical-align:-3px;flex:none}
.vchk svg{width:11px;height:11px;stroke:#fff;stroke-width:3}
.vbig{display:inline-flex;align-items:center;gap:5px;color:var(--blue);font-weight:700}
.sh h2{font:800 18px/1.2 var(--body)}
.secbar{background:var(--navy);color:#fff;border-radius:14px 14px 0 0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.secbar h2{margin:0;color:#fff;font:800 17px/1.2 var(--body)}
.secbar a{color:#FFB37A;font-weight:700;font-size:13px}
.secbox{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:10px}
.secbar.fl{background:linear-gradient(90deg,#E5383B,#FF6A00)}
.timer b{background:#fff;color:var(--bad)}
.pc{background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(11,24,64,.05)}
.pc .price{color:var(--navy);font-weight:800}
.tag.off{background:#FFE7DA;color:var(--gold2);border-color:#FFD2BA}
.stockbar{height:5px;border-radius:3px;background:#FFE0CC;overflow:hidden;margin:2px 0}
.stockbar i{display:block;height:100%;background:var(--gold)}
.paylogos{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.paylogos img{height:34px;width:auto;border-radius:8px}
.paybtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.paybtns label{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;border:2px solid var(--line);border-radius:14px;cursor:pointer;background:#fff;font-weight:700;font-size:13px}
.paybtns input{position:absolute;opacity:0}
.paybtns label:has(input:checked){border-color:var(--gold);background:#FFF5EE}
.paybtns img{height:48px;width:auto;border-radius:10px}
.paybtns b{font-size:16px;color:var(--navy)}
.launch{background:linear-gradient(90deg,#14A86B,#0E7C66);color:#fff;border-radius:14px;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:center}
footer.f{background:var(--navy);color:#C9D1E6}
footer.f a{color:#fff}
footer.f .paylogos{justify-content:center;margin:10px 0}
.wa{background:#25D366}
.shwa{display:flex;align-items:center;justify-content:center;gap:8px;background:#25D366;color:#fff;border-radius:12px;padding:11px;font-weight:700}
.hero{display:none}
.demo{background:#FFF1E6;color:var(--gold2)}
.gal .cnt{color:#fff}
.carousel{aspect-ratio:auto;height:clamp(190px,52vw,320px)}
.slide{padding:16px 18px 26px}
.slide>div:first-child{position:relative;z-index:2}
.s1 .big{right:14px;bottom:auto;top:50%;margin-top:-62px;width:124px;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.35);animation:float 4s ease-in-out infinite}

.vchk.vimg{width:18px;height:18px;background:none;border-radius:0;object-fit:contain;vertical-align:-4px}

/* Bannière : produits 3D + photos */
.s1{background:radial-gradient(circle at 78% 55%,#2A4BB0 0%,#16307A 35%,#0B1840 75%)}
.s1 h2{max-width:56%}.s1 p{max-width:52%}
.stage3d{position:absolute;right:0;top:0;bottom:0;width:48%;perspective:700px;z-index:1}
.stage3d:after{content:"";position:absolute;left:12%;right:8%;bottom:12%;height:14%;background:radial-gradient(ellipse,rgba(0,0,0,.45),transparent 70%);filter:blur(4px)}
.p3{position:absolute;object-fit:contain;filter:drop-shadow(0 14px 14px rgba(0,0,0,.45));transform-style:preserve-3d;will-change:transform}
.p3-0{width:58%;left:2%;bottom:14%;z-index:3;animation:f3a 5s ease-in-out infinite}
.p3-1{width:40%;right:2%;top:6%;z-index:2;animation:f3b 6s ease-in-out infinite}
.p3-2{width:30%;left:8%;top:4%;z-index:1;animation:f3c 5.5s ease-in-out infinite}
.p3-3{width:38%;right:0;bottom:10%;z-index:4;animation:f3d 4.6s ease-in-out infinite}
@keyframes f3a{0%,100%{transform:translateY(0) rotateY(-18deg) rotateZ(-6deg)}50%{transform:translateY(-10px) rotateY(14deg) rotateZ(-2deg)}}
@keyframes f3b{0%,100%{transform:translateY(0) rotateY(20deg)}50%{transform:translateY(-12px) rotateY(-16deg)}}
@keyframes f3c{0%,100%{transform:translateY(-6px) rotateY(-14deg) rotateZ(5deg)}50%{transform:translateY(6px) rotateY(18deg) rotateZ(-3deg)}}
@keyframes f3d{0%,100%{transform:translateY(-4px) rotateY(16deg) rotateZ(4deg)}50%{transform:translateY(8px) rotateY(-20deg) rotateZ(-4deg)}}
.slide.ph{background-size:cover;background-position:center right}
.slide.ph:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,24,64,.92) 0%,rgba(11,24,64,.7) 45%,rgba(11,24,64,0) 80%)}
.slide.ph h2{max-width:60%}
@media (prefers-reduced-motion:reduce){.p3{animation:none}}
.slide h2{font-size:clamp(19px,5.2vw,38px)}
.slide .kick{font-size:10px}
.s1 h2{max-width:58%}

/* suggestions de recherche */
#sf{position:relative}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border-radius:16px;box-shadow:0 14px 34px rgba(11,24,64,.18);border:1px solid #E6E8EF;z-index:60;max-height:min(70vh,460px);overflow:auto;padding:6px 0}
.sugg a{display:flex;align-items:center;gap:10px;padding:9px 14px;color:var(--text);text-decoration:none;font-size:14px}
.sugg a:active,.sugg a:hover{background:#F4F5F9}

let D;
async function firebaseLayer() {
  const [A, U, F] = await Promise.all([import(SDK + "firebase-app.js"), import(SDK + "firebase-auth.js"), import(SDK + "firebase-firestore.js")]);
  const fa = A.initializeApp(CFG, "velzaro"); const auth = U.getAuth(fa); auth.languageCode = "fr"; const db = F.getFirestore(fa);
  const ref = (c, id) => F.doc(db, ...c.split("/"), id);
  const col = c => F.collection(db, ...c.split("/"));
  const q = (c, w) => F.query(col(c), ...(w || []).map(([a, o, b]) => F.where(a, o, b)));
  const rows = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
  let adminCache = null;
  return {
    get: async (c, id) => { const s = await F.getDoc(ref(c, id)); return s.exists() ? { id: s.id, ...s.data() } : null; },
    list: async (c, w) => rows(await F.getDocs(q(c, w))),
    add: async (c, o) => (await F.addDoc(col(c), o)).id,
    set: (c, id, o) => F.setDoc(ref(c, id), o),
    upd: (c, id, o) => F.updateDoc(ref(c, id), o),
    del: (c, id) => F.deleteDoc(ref(c, id)),
    watch: (c, w, cb) => F.onSnapshot(q(c, w), s => cb(rows(s)), () => {}),
    watchDoc: (c, id, cb) => F.onSnapshot(ref(c, id), s => cb(s.exists() ? { id: s.id, ...s.data() } : null), () => {}),
    onAuth: cb => U.onAuthStateChanged(auth, u => { adminCache = null; cb(u && !u.isAnonymous ? { uid: u.uid, email: u.email, name: u.displayName || "" } : null); }),
    google: async () => { const p = new U.GoogleAuthProvider(); try { await U.signInWithPopup(auth, p); } catch (e) { if (/popup/.test(e.code || "")) await U.signInWithRedirect(auth, p); else throw e; } },
    emailIn: (e, p) => U.signInWithEmailAndPassword(auth, e, p),
    emailUp: async (e, p, n) => { const c = await U.createUserWithEmailAndPassword(auth, e, p); try { await U.updateProfile(c.user, { displayName: n }); } catch (x) {} },
    reset: e => U.sendPasswordResetEmail(auth, e),
    out: () => U.signOut(auth),
    delAccount: async () => { const u = auth.currentUser; if (!u) return; try { await U.deleteUser(u); } catch (e) { if (e.code === "auth/requires-recent-login" && u.providerData.some(p => p.providerId === "google.com")) { await U.reauthenticateWithPopup(u, new U.GoogleAuthProvider()); await U.deleteUser(u); } else throw e; } },
    isAdmin: async () => { if (adminCache !== null) return adminCache; try { await F.getDoc(ref("config", "velzaro")); adminCache = true; } catch (e) { adminCache = false; } return adminCache; }
  };
}
function demoLayer() {
  const K = "vz-demo-db"; let db = store.get(K, null);
  const save = () => store.set(K, db);
  if (!db) { db = { sellers: {}, products: {}, orders: {}, users: {}, reviews: {}, tickets: {}, subs: {}, errors: {} }; seed(db); save(); }
  const C = c => (db[c] = db[c] || {});
  const match = (d, w) => (w || []).every(([a, o, b]) => o === "==" ? d[a] === b : o === "array-contains" ? (d[a] || []).includes(b) : true);
  const lst = (c, w) => Object.entries(C(c)).map(([id, d]) => ({ id, ...d })).filter(d => match(d, w));
  let user = store.get("vz-demo-user", null), auths = [];
  const emit = () => auths.forEach(f => f(user));
  const uid = () => Math.random().toString(36).slice(2, 12);
  return {
    get: async (c, id) => C(c)[id] ? { id, ...C(c)[id] } : null,
    list: async (c, w) => lst(c, w),
    add: async (c, o) => { const id = uid(); C(c)[id] = JSON.parse(JSON.stringify(o)); save(); return id; },
    set: async (c, id, o) => { C(c)[id] = JSON.parse(JSON.stringify(o)); save(); },
    upd: async (c, id, o) => { if (!C(c)[id]) throw { code: "not-found" }; Object.assign(C(c)[id], JSON.parse(JSON.stringify(o))); save(); },
    del: async (c, id) => { delete C(c)[id]; save(); },
    watch: (c, w, cb) => { let last = ""; const f = () => { try { db = store.get(K, db); } catch (e) {} const r = lst(c, w); const s = JSON.stringify(r); if (s !== last) { last = s; cb(r); } }; f(); const t = setInterval(f, 900); return () => clearInterval(t); },
    watchDoc: (c, id, cb) => { let last = ""; const f = () => { db = store.get(K, db); const d = C(c)[id] ? { id, ...C(c)[id] } : null; const s = JSON.stringify(d); if (s !== last) { last = s; cb(d); } }; f(); const t = setInterval(f, 900); return () => clearInterval(t); },
    onAuth: cb => { auths.push(cb); setTimeout(() => cb(user), 0); },
    google: async () => { user = { uid: "demo-client", email: "client@demo.sn", name: "Client Démo" }; store.set("vz-demo-user", user); emit(); },
    emailIn: async (e) => { user = { uid: "u-" + e.replace(/\W/g, ""), email: e, name: e.split("@")[0] }; store.set("vz-demo-user", user); emit(); },
    emailUp: async (e, p, n) => { user = { uid: "u-" + e.replace(/\W/g, ""), email: e, name: n }; store.set("vz-demo-user", user); emit(); },
    reset: async () => {},
    out: async () => { user = null; store.set("vz-demo-user", null); emit(); },
    delAccount: async () => { user = null; store.set("vz-demo-user", null); emit(); },
    isAdmin: async () => !!user && user.email === "admin@velzaro.sn"
  };
}

let carT;
function carousel() {
  clearInterval(carT); const sl = $("#slides"), dots = [...document.querySelectorAll("#cdots button")]; if (!sl) return; let i = 0;
  const N = sl.children.length; const show = n => { i = (n + N) % N; sl.style.transform = `translateX(-${i * 100}%)`; dots.forEach((d, k) => d.classList.toggle("on", k === i)); };
  dots.forEach((d, k) => d.onclick = () => { show(k); clearInterval(carT); carT = setInterval(() => { if (!$("#slides")) return clearInterval(carT); show(i + 1); }, 4500); });
  let x0 = null; sl.ontouchstart = e => x0 = e.touches[0].clientX; sl.ontouchend = e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1)); x0 = null; };
  carT = setInterval(() => { if (!$("#slides")) return clearInterval(carT); show(i + 1); }, 4500);
}
function opal() {
  const o = $("#opal"); if (!o) return; let tx = 0, ty = 0;
  const set = () => { o.style.transform = `rotateX(${ty}deg) rotateY(${tx}deg)`; };
  window.onpointermove = e => { tx = (e.clientX / innerWidth - .5) * 30; ty = -(e.clientY / innerHeight - .5) * 30; set(); };
  window.ondeviceorientation = e => { if (e.gamma == null) return; tx = Math.max(-25, Math.min(25, e.gamma)); ty = Math.max(-25, Math.min(25, (e.beta || 0) - 45)) * -1; set(); };
  window.onscroll = () => { const r = scrollY / 6; o.style.transform = `rotateX(${ty + r / 4}deg) rotateY(${tx + r}deg)`; };
}
let timerT;
function timer() {
  clearInterval(timerT); const el = () => $("#timer"); if (!el()) return;
  const f = () => { const e = el(); if (!e) return clearInterval(timerT); const m = new Date(); m.setHours(24, 0, 0, 0); let s = Math.max(0, (m - Date.now()) / 1000 | 0); const h = s / 3600 | 0, mi = (s % 3600) / 60 | 0, se = s % 60; e.innerHTML = [h, mi, se].map(v => `<b>${String(v).padStart(2, "0")}</b>`).join(":"); };
  f(); timerT = setInterval(f, 1000);
}

async function compress(file, max = 900, cap = 220000) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = typeof file === "string" ? file : URL.createObjectURL(file); });
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  let q = .78, out = c.toDataURL("image/jpeg", q); while (out.length > cap && q > .4) { q -= .08; out = c.toDataURL("image/jpeg", q); }
  return out;
}

function NORM(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim(); }
var SYN = { tel: "telephone smartphone portable", telephone: "tel smartphone portable", portable: "telephone smartphone", smartphone: "telephone portable", chaussure: "basket sneaker sandale soulier", chaussures: "basket sneaker sandale", basket: "chaussure sneaker", baskets: "chaussure sneaker", sac: "sacoche cartable", wifi: "routeur modem mifi internet 4g", internet: "wifi routeur modem", montre: "smartwatch watch", casque: "ecouteur headphone", ecouteur: "casque", robe: "tenue", habit: "vetement tenue", vetement: "habit tenue", parfum: "beaute", creme: "beaute", tv: "television tele", tele: "television tv" };
function lev1(a, b) { if (Math.abs(a.length - b.length) > 1) return false; let i = 0, j = 0, e = 0; while (i < a.length && j < b.length) { if (a[i] === b[j]) { i++; j++; continue; } if (++e > 1) return false; if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; } } return e + (a.length - i) + (b.length - j) <= 1; }
function variants(w) { const v = new Set([w]); if (w.length > 3 && /[sx]$/.test(w)) v.add(w.slice(0, -1)); (SYN[w] || "").split(" ").filter(Boolean).forEach(x => v.add(x)); return [...v]; }
function wordHit(w, words, hay) { const flat = hay.replace(/ /g, ""); for (const v of variants(w)) { if (hay.includes(v) || (v.length > 2 && flat.includes(v))) return 1; if (v.length >= 3 && words.some(x => lev1(x, v) || (x.length > v.length && lev1(x.slice(0, v.length + 1), v)))) return .7; } return 0; }
function scoreP(p, ws) {
  const t = NORM(p.title), hay = NORM(p.title + " " + (p.desc || "") + " " + (CATN[p.cat] || "") + " " + (S.sellers[p.sellerId]?.shop || "")), w0 = hay.split(" "), words = w0.concat(w0.slice(1).map((x, k) => w0[k] + x));
  let sc = 0, all = true; for (const w of ws) { const h = wordHit(w, words, hay); if (!h) all = false; sc += h + (t.includes(w) ? 1 : 0) + (t.startsWith(w) ? .5 : 0); }
  return { sc, all };
}
function rankSearch(q, max) {
  const ws = NORM(q).split(" ").filter(Boolean); if (!ws.length) return [];
  const r = S.products.map(p => ({ p, ...scoreP(p, ws) })).filter(x => x.sc > 0);
  let best = r.filter(x => x.all); if (!best.length) best = r;
  best.sort((a, b) => b.sc - a.sc); return best.slice(0, max || 999).map(x => x.p);
}

    <label class="lftog"><input type="checkbox" id="lfvf" ${LF.vf ? "checked" : ""}><span>${AS.badge ? `<img src="${AS.badge}" alt="" style="width:18px;height:18px">` : ""}Vendeurs vérifiés seulement</span></label>
    <label class="lftog"><input type="checkbox" id="lfpr" ${LF.promo ? "checked" : ""}><span>⚡ En promotion</span></label>
    <label class="lftog"><input type="checkbox" id="lfst" ${LF.stock ? "checked" : ""}><span>📦 En stock</span></label>
    <div class="lfact"><button type="button" class="btn sm" id="lfr">Effacer</button><button type="button" class="btn gold sm" id="lfa">Voir les résultats</button></div>
  </div>`;
}
function lfApply(base) {
  let l = base.slice(); const mn = +String(LF.pmin).replace(/\D/g, "") || 0, mx = +String(LF.pmax).replace(/\D/g, "") || 0;
  if (mn) l = l.filter(p => p.price >= mn); if (mx) l = l.filter(p => p.price <= mx);
  if (LF.vf) l = l.filter(p => S.sellers[p.sellerId]?.verified);
  if (LF.promo) l = l.filter(p => p.oldPrice > p.price);
  if (LF.stock) l = l.filter(p => (p.stock ?? 1) > 0);
  if (LF.reg) l = l.filter(p => (S.sellers[p.sellerId]?.region || "") === LF.reg);
  const off = p => p.oldPrice > p.price ? (p.oldPrice - p.price) / p.oldPrice : 0;
  if (LF.sort === "pa") l.sort((a, b) => a.price - b.price);
  if (LF.sort === "pd") l.sort((a, b) => b.price - a.price);
  if (LF.sort === "new") l.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  if (LF.sort === "promo") l.sort((a, b) => off(b) - off(a));
  return l;
}
function lfBind(base, emptyMsg) {
  const draw = () => {
    const l = lfApply(base), c = $("#lcount"), r = $("#lres"); if (!r) return;
    if (c) c.textContent = base.length ? `${l.length} produit${l.length > 1 ? "s" : ""}${l.length !== base.length ? ` sur ${base.length}` : ""}` : "";
    r.innerHTML = l.length ? `<div class="grid">${l.map(p => card(p)).join("")}</div>` : base.length ? `<div class="empty"><b>Aucun produit avec ces filtres</b>Essaie d'élargir ta recherche.<div style="margin-top:12px"><button type="button" class="btn sm" id="lfr2">Effacer les filtres</button></div></div>` : emptyMsg;
    const r2 = $("#lfr2"); if (r2) r2.onclick = reset;
    const b = $("#lfo"), n = lfCount(); if (b) { b.classList.toggle("on", !!n); b.innerHTML = `${I("filter")}Filtres${n ? ` <b>${n}</b>` : ""}`; }
  };
  const read = () => { LF.pmin = $("#lfmin")?.value || ""; LF.pmax = $("#lfmax")?.value || ""; LF.reg = $("#lfreg")?.value || ""; LF.vf = !!$("#lfvf")?.checked; LF.promo = !!$("#lfpr")?.checked; LF.stock = !!$("#lfst")?.checked; };
  const reset = () => { Object.assign(LF, { vf: false, promo: false, stock: false, pmin: "", pmax: "", reg: "" }); ["#lfvf", "#lfpr", "#lfst"].forEach(k => { const e = $(k); if (e) e.checked = false; }); ["#lfmin", "#lfmax", "#lfreg"].forEach(k => { const e = $(k); if (e) e.value = ""; }); draw(); };
  const s = $("#lfs"); if (s) s.onchange = () => { LF.sort = s.value; draw(); };
  const o = $("#lfo"), p = $("#lfp"); if (o && p) o.onclick = () => { p.hidden = !p.hidden; };
  const a = $("#lfa"); if (a) a.onclick = () => { read(); p.hidden = true; draw(); };
  const rr = $("#lfr"); if (rr) rr.onclick = () => { reset(); };
  draw();
}

/* ---------- Options produit (tailles / couleurs) ---------- */
function splitOpts(v) { return [...new Set(String(v || "").split(/[,;\n]/).map(x => x.trim()).filter(Boolean))].slice(0, 12).map(x => x.slice(0, 24)); }
function optPanel(p) {
  const g = (k, label, arr) => arr?.length ? `<div class="optg" data-g="${k}"><div class="optt">${label} <span class="optv" id="ov-${k}">— choisis</span></div><div class="optc">${arr.map(v => `<button type="button" class="optb" data-v="${esc(v)}">${esc(v)}</button>`).join("")}</div></div>` : "";
  const h = g("t", "Taille", p.sizes) + g("c", "Couleur", p.colors);
  return h ? `<div class="panel" id="optp">${h}</div>` : "";
}
function optBind() {
  document.querySelectorAll(".optg").forEach(gr => gr.querySelectorAll(".optb").forEach(b => b.onclick = () => {
    gr.querySelectorAll(".optb").forEach(x => x.classList.remove("on")); b.classList.add("on"); gr.dataset.sel = b.dataset.v; gr.classList.remove("need");
    const o = $("#ov-" + gr.dataset.g); if (o) o.textContent = b.dataset.v;
  }));
}
function optRead(p) {
  const parts = []; let miss = null;
  [["t", "Taille", p.sizes], ["c", "Couleur", p.colors]].forEach(([k, l, arr]) => { if (!arr?.length) return; const gr = document.querySelector(`.optg[data-g="${k}"]`); const v = gr?.dataset.sel; if (!v) { miss = miss || [gr, l]; } else parts.push(`${l} : ${v}`); });
  if (miss) { miss[0]?.classList.add("need"); miss[0]?.scrollIntoView({ behavior: "smooth", block: "center" }); toast(`Choisis d'abord : ${miss[1].toLowerCase()}`); return null; }
  return parts.join(" · ");
}

/* ---------- Visionneuse photo plein écran ---------- */
function lightbox(list, start) {
  if (!list.length) return;

    <div class="lbtrack">${list.map(u => `<div class="lbs"><img src="${esc(u)}" alt=""></div>`).join("")}</div><div class="lbhint">Touche deux fois pour zoomer</div>`;
  document.body.appendChild(el); document.body.style.overflow = "hidden";
  const tr = el.querySelector(".lbtrack"); requestAnimationFrame(() => { tr.scrollLeft = start * tr.clientWidth; });
  tr.onscroll = () => { el.querySelector("#lbn").textContent = `${Math.round(tr.scrollLeft / tr.clientWidth) + 1} / ${list.length}`; };
  const close = () => { el.remove(); document.body.style.overflow = ""; window.removeEventListener("hashchange", close); };
  el.querySelector(".lbx-x").onclick = close; window.addEventListener("hashchange", close);
  el.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  el.querySelectorAll(".lbs").forEach(sl => { let last = 0; const z = e => { const im = sl.querySelector("img"); const on = !sl.classList.contains("z"); sl.classList.toggle("z", on); tr.style.overflowX = on ? "hidden" : ""; if (on) { const r = sl.getBoundingClientRect(); requestAnimationFrame(() => { sl.scrollLeft = (e.clientX - r.left) * 1.2; sl.scrollTop = (e.clientY - r.top) * 1.2; }); } };
    sl.addEventListener("dblclick", z); sl.addEventListener("touchend", e => { const t = Date.now(); if (t - last < 300) { e.preventDefault(); z(e.changedTouches[0]); } last = t; }); });
  el.tabIndex = -1; el.focus();
}

/* ---------- Statistiques vendeur ---------- */
async function sellerStats(s, top) {
  const uid = S.user.uid, DAY = 864e5, now = Date.now();
  const [os, rv] = await Promise.all([D.list("orders", [["sellerId", "==", uid]]).catch(() => []), D.list("reviews", [["sellerId", "==", uid]]).catch(() => [])]);
  await loadCatalog(); const mine = S.products.filter(p => p.sellerId === uid);
  const ok = os.filter(o => ["paid", "shipped", "delivered"].includes(o.status));
  const sum = a => a.reduce((x, o) => x + (o.sub || 0), 0);
  const ca = sum(ok), ca30 = sum(ok.filter(o => o.createdAt > now - 30 * DAY)), ca30p = sum(ok.filter(o => o.createdAt <= now - 30 * DAY && o.createdAt > now - 60 * DAY));
  const avg = ok.length ? Math.round(ca / ok.length) : 0;
  const conv = os.length ? Math.round(ok.length * 100 / os.length) : 0;
  const note = rv.length ? rv.reduce((a, r) => a + r.stars, 0) / rv.length : 0;
  const trend = ca30p ? Math.round((ca30 - ca30p) * 100 / ca30p) : null;
  // 14 derniers jours
  const days = [...Array(14)].map((_, k) => { const d0 = new Date(now - (13 - k) * DAY); d0.setHours(0, 0, 0, 0); const t0 = d0.getTime(); return { d: d0, v: sum(ok.filter(o => o.createdAt >= t0 && o.createdAt < t0 + DAY)) }; });
  const mx = Math.max(1, ...days.map(x => x.v));
  // top produits
  const tp = {}; ok.forEach(o => (o.items || []).forEach(i => { tp[i.pid] = tp[i.pid] || { t: i.title, q: 0, v: 0 }; tp[i.pid].q += i.qty; tp[i.pid].v += i.qty * i.price; }));
  const top5 = Object.values(tp).sort((a, b) => b.v - a.v).slice(0, 5);
  const low = mine.filter(p => (p.stock ?? 0) <= 2);
  const kpi = (v, l, sub = "") => `<div><b>${v}</b><span>${l}</span>${sub}</div>`;
  shell("acc", `${top}
  <div class="kpis st-k">${kpi(fcfa(ca), "ventes encaissées")}${kpi(fcfa(ca30), "ces 30 jours", trend === null ? "" : `<i class="${trend >= 0 ? "up" : "down"}">${trend >= 0 ? "▲" : "▼"} ${Math.abs(trend)} %</i>`)}${kpi(ok.length, "commandes payées")}${kpi(fcfa(avg), "panier moyen")}${kpi(conv + " %", "commandes réussies")}${kpi(note ? note.toFixed(1) + " ★" : "—", `${rv.length} avis`)}</div>
  <div class="panel"><h3 style="margin-top:0">Ventes des 14 derniers jours</h3>
    <div class="st-chart" role="img" aria-label="Ventes par jour">${days.map(x => `<div class="st-col" title="${x.d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" })} : ${fcfa(x.v)}"><span class="st-bar" style="height:${Math.max(x.v ? 6 : 2, Math.round(x.v * 100 / mx))}%"></span><small>${x.d.getDate()}</small></div>`).join("")}</div>
    ${ok.length ? "" : `<p class="small muted" style="margin:10px 0 0">Tes ventes s'afficheront ici dès ta première commande payée.</p>`}</div>
  <div class="panel"><h3 style="margin-top:0">Tes meilleurs produits</h3>${top5.length ? top5.map((x, k) => `<div class="tot"><span><b>${k + 1}.</b> ${esc(x.t)} <span class="muted small">· ${x.q} vendu${x.q > 1 ? "s" : ""}</span></span><b>${fcfa(x.v)}</b></div>`).join("") : `<p class="small muted" style="margin:0">Pas encore de ventes.</p>`}</div>
  ${low.length ? `<div class="panel" style="border:1.5px solid #FFD2B0"><h3 style="margin-top:0">⚠️ Stock presque épuisé</h3>${low.map(p => `<div class="tot"><span>${esc(p.title)}</span><a class="small" href="#/vendeur/edit/${p.id}" style="color:var(--gold);font-weight:700">${p.stock || 0} restant${(p.stock || 0) > 1 ? "s" : ""} · Modifier</a></div>`).join("")}</div>` : ""}
  <div class="panel small muted">💡 <b>Conseil :</b> les produits avec 3 photos nettes sur fond clair et une description complète se vendent beaucoup mieux. Réponds vite aux commandes : les clients reviennent chez les vendeurs rapides.</div>`, { chips: false });
}

/* ---------- Suppression du compte ---------- */
function deleteAccount() {
  const el = document.createElement("div"); el.className = "sheet-bg";
  el.innerHTML = `<form class="sheet" id="daf"><div class="sheet-h"><b>Supprimer mon compte</b><button type="button" class="ibtn" id="dax" aria-label="Fermer">${I("x")}</button></div>
    <p class="small" style="margin:4px 0 10px">Cette action est <b>définitive</b>. Seront effacés :</p>
    <ul class="small muted" style="margin:0 0 10px;padding-left:18px"><li>ton profil (nom, téléphone, adresse)</li>${S.seller ? "<li>ta boutique et tous tes produits</li>" : ""}<li>tes favoris et ton panier sur cet appareil</li><li>ton accès au compte</li></ul>
    <p class="small muted" style="margin:0 0 12px">L'historique des commandes déjà passées est gardé pour l'autre partie (acheteur ou vendeur).</p>
    <div class="field"><label for="dac">Écris <b>SUPPRIMER</b> pour confirmer</label><input id="dac" autocomplete="off" autocapitalize="characters" required></div>
    <button class="btn bad full" id="dab">Supprimer définitivement</button><p class="msg" id="dam"></p></form>`;
  document.body.appendChild(el);
  const close = () => el.remove(); el.querySelector("#dax").onclick = close; el.onclick = e => { if (e.target === el) close(); };
  el.querySelector("#daf").onsubmit = async e => {
    e.preventDefault(); const m = $("#dam"), b = $("#dab");
    if ($("#dac").value.trim().toUpperCase() !== "SUPPRIMER") { m.className = "msg err"; m.textContent = "Écris SUPPRIMER en majuscules pour confirmer."; return; }
    b.disabled = true; m.className = "msg"; m.textContent = "Suppression en cours…";
    try {
      const uid = S.user.uid, live = ["confirm", "topay", "claimed", "paid", "shipped"];
      const [ob, os] = await Promise.all([D.list("orders", [["buyerId", "==", uid]]).catch(() => []), S.seller ? D.list("orders", [["sellerId", "==", uid]]).catch(() => []) : []]);
      const act = ob.concat(os).filter(o => live.includes(o.status));
      if (act.length) { b.disabled = false; m.className = "msg err"; m.innerHTML = `Tu as encore <b>${act.length} commande${act.length > 1 ? "s" : ""} en cours</b>. Termine-${act.length > 1 ? "les" : "la"} ou annule-${act.length > 1 ? "les" : "la"} d'abord.`; return; }
      if (S.seller) { const ps = await D.list("products", [["sellerId", "==", uid]]).catch(() => []); for (const p of ps) await D.del("products", p.id).catch(() => {}); await D.del("sellers", uid).catch(() => {}); }
      await D.del("users", uid).catch(() => {});
      ["vz-cart", "vz-favs", "vz-seen", "vz-rs", "vz-region", "vz-after"].forEach(k => { try { localStorage.removeItem(k); } catch (x) {} });
      await D.delAccount();
      close(); S.loaded = false; toast("Ton compte a été supprimé. Au revoir 👋"); go("#/");
    } catch (x) {
      b.disabled = false; m.className = "msg err";
      m.textContent = x.code === "auth/requires-recent-login" ? "Par sécurité, déconnecte-toi, reconnecte-toi, puis recommence." : "Erreur : " + (x.code || x.message);
    }
  };
}
